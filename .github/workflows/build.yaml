name: build

# ------------- NOTE
# GHCR images are published to ghcr.io/wirh/rustdesk-server-pro
# (and -classic) with the built-in GITHUB_TOKEN; no setup needed.
# Docker Hub push is optional: set these secrets to also publish there,
# otherwise only GHCR is used and the Docker Hub steps are skipped.
# DOCKER_IMAGE should be the target image name on docker hub (e.g. "<user>/rustdesk-server-pro" )
# DOCKER_IMAGE_CLASSIC should be the target image name on docker hub for the old build (e.g. "<user>/rustdesk-server-pro-classic" )
# DOCKER_HUB_USERNAME is the username you normally use to login at https://hub.docker.com/
# DOCKER_HUB_PASSWORD is a token you should create under "account settings / security" with read/write access
# Tagging: integer tags (v45) move latest (their major tag equals the
# version tag, so no separate :major manifest is created); preview tags
# (v45.1) only get their version tag. workflow_dispatch runs push only a
# throwaway ci-test tag to GHCR, never latest.

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  CARGO_TERM_COLOR: always
  LATEST_TAG: latest
  GHCR_IMAGE: ghcr.io/wirh/rustdesk-server-pro
  GHCR_IMAGE_CLASSIC: ghcr.io/wirh/rustdesk-server-pro-classic
  # Docker Hub is optional: these flags say whether its secrets are set.
  # (`secrets` cannot be used in `if` expressions, hence the indirection.)
  DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_USERNAME != '' }}
  DOCKER_HUB_CONFIGURED: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_IMAGE != '' }}
  DOCKER_HUB_CLASSIC_CONFIGURED: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_IMAGE_CLASSIC != '' }}
  
jobs:

  # binary build
  build:

    name: Build - ${{ matrix.job.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7",   target: "armv7-unknown-linux-musleabihf" }
          - { name: "i386",    target: "i686-unknown-linux-musl" }
          #- { name: "amd64fb",    target: "x86_64-unknown-freebsd" }

    steps:
      
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "stable"
          override: true
          default: true
          components: rustfmt
          profile: minimal
          target: ${{ matrix.job.target }}

      - name: Create compile-time SQLite database
        run: |
          python3 - <<'PYEOF'
          import re, sqlite3
          # The sqlx query!/query_as! macros in src/database.rs type-check
          # against a live database at compile time (DATABASE_URL from
          # .env). The checked-in .env points at an absolute path that
          # only exists on the dev machine, so create the database here
          # and point .env at it. The schema is extracted from the DDL in
          # src/database.rs, so it cannot drift from the app's schema.
          src = open('src/database.rs').read()
          m = re.search(r'sqlx::query!\(\s*"(.*?)"\s*\)', src, re.S)
          assert m, 'DDL not found in src/database.rs'
          db = sqlite3.connect('db_v2.sqlite3')
          db.executescript(m.group(1))
          db.commit()
          db.close()
          open('.env', 'w').write('DATABASE_URL=sqlite:db_v2.sqlite3\n')
          print('compile-time database ready')
          PYEOF

      - name: Set PRO_FULL_VERSION for preview tags
        # Preview tags (vN.M) bake the full version into hbbs so the
        # updater can tell an installed preview from its formal base;
        # formal tags (vN) and dispatch runs skip this step, and the
        # shell regex below is the precise gate (three-part tags such
        # as v1.2.3 are not previews). The variable reaches the cross
        # build container via Cross.toml [build.env] passthrough.
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '.')
        run: |
          T=${GITHUB_REF_NAME}
          if [[ "$T" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "PRO_FULL_VERSION=${T#v}" >> "$GITHUB_ENV"
            echo "preview tag $T: PRO_FULL_VERSION=${T#v}"
          else
            echo "tag $T is not a vN.M preview tag; PRO_FULL_VERSION stays unset"
          fi

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=${{ matrix.job.target }}
          use-cross: true  

      - name: Exec chmod
        run: chmod -v a+x target/${{ matrix.job.target }}/release/*

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error

  # NOTE: disabled (if: false). The sqlx-macros proc-macro DLL fails to
  # load on the Windows runner (LoadLibraryExW error 1114), a pre-existing
  # failure also present on v44 code; disabling LTO did not fix it. The
  # Windows CI artifacts are not consumed (releases are published
  # manually; Windows packages are built locally), so this job is parked
  # until the DLL issue is fixed. Re-enabling also needs the same
  # compile-time SQLite database step as the Linux build job.
  build-win:
    name: Build - windows
    if: false
    runs-on: windows-2022

    steps:
      
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "stable"
          override: true
          default: true
          components: rustfmt
          profile: minimal
          target: x86_64-pc-windows-msvc

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --all-features --target=x86_64-pc-windows-msvc
          use-cross: true

      - name: Install NSIS
        run: |
          iwr -useb get.scoop.sh -outfile 'install.ps1'
          .\install.ps1 -RunAsAdmin
          scoop update
          scoop bucket add extras
          scoop install nsis

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Sign exe files
        uses: GermanBluefox/code-sign-action@v7
        if: false
        with:
          certificate: '${{ secrets.WINDOWS_PFX_BASE64 }}'
          password: '${{ secrets.WINDOWS_PFX_PASSWORD }}'
          certificatesha1: '${{ secrets.WINDOWS_PFX_SHA1_THUMBPRINT }}'
          folder: 'target\x86_64-pc-windows-msvc\release'
          recursive: false

      - name: Build UI browser file
        run: |
          npm i
          npm run build
        working-directory: ./ui/html

      - name: Build UI setup file
        run: |
          rustup default nightly
          cargo build --release
          xcopy /y ..\target\x86_64-pc-windows-msvc\release\*.exe setup\bin\
          xcopy /y target\release\*.exe setup\
          mkdir setup\logs
          makensis /V1 setup.nsi
          mkdir SignOutput
          mv RustDeskServer.Setup.exe SignOutput\
          mv ..\target\x86_64-pc-windows-msvc\release\*.exe SignOutput\
        working-directory: ./ui

      - name: Sign UI setup file 
        uses: GermanBluefox/code-sign-action@v7
        if: false
        with:
          certificate: '${{ secrets.WINDOWS_PFX_BASE64 }}'
          password: '${{ secrets.WINDOWS_PFX_PASSWORD }}'
          certificatesha1: '${{ secrets.WINDOWS_PFX_SHA1_THUMBPRINT }}'
          folder: './ui/SignOutput'
          recursive: false

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x86_64
          path: |
            ui\SignOutput\hbbr.exe
            ui\SignOutput\hbbs.exe
            ui\SignOutput\rustdesk-utils.exe
            ui\SignOutput\RustDeskServer.Setup.exe
          if-no-files-found: error

  # github (draft) release with all binaries
  # NOTE: releases are published manually (gh CLI + package_pro.sh assets,
  # after release-copy review), so CI must not create draft releases here.
  release:

    name: Github release
    if: false
    needs: 
      - build
      - build-win
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: "linux", name: "amd64", suffix: "" }
          - { os: "linux", name: "arm64v8", suffix: "" }
          - { os: "linux", name: "armv7", suffix: "" }
          - { os: "linux", name: "i386", suffix: "" }
          #- { os: "linux", name: "amd64fb", suffix: "" }
          - { os: "windows", name: "x86_64", suffix: "-unsigned" }
          
    steps:

      - name: Download binaries (${{ matrix.job.os }} - ${{ matrix.job.name }})
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.job.os }}-${{ matrix.job.name }}
          path: ${{ matrix.job.name }}

      - name: Exec chmod
        run: chmod -v a+x ${{ matrix.job.name }}/*

      - name: Pack files (${{ matrix.job.os }} - ${{ matrix.job.name }})
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y zip
          zip ${{ matrix.job.name }}/rustdesk-server-${{ matrix.job.os }}-${{ matrix.job.name }}${{ matrix.job.suffix }}.zip ${{ matrix.job.name }}/*

      - name: Create Release (${{ matrix.job.os }} - (${{ matrix.job.name }})
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: ${{ matrix.job.name }}/rustdesk-server-${{ matrix.job.os }}-${{ matrix.job.name }}${{ matrix.job.suffix }}.zip
            
  # docker build and push of single-arch images
  docker:

    name: Docker push - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64",  s6_platform: "x86_64" }
          - { name: "arm64v8", docker_platform: "linux/arm64",  s6_platform: "aarch64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7", s6_platform: "armhf" }
          - { name: "i386",    docker_platform: "linux/386",    s6_platform: "i686" }

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
        
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin

      - name: Make binaries executable
        run: chmod -v a+x docker/rootfs/usr/bin/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_HUB_LOGIN == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.GHCR_IMAGE }}

      - name: Compute image tags
        id: tags
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Validation run: push only a throwaway test tag to GHCR, never latest.
            echo "tags=${{ env.GHCR_IMAGE }}:ci-test-${{ matrix.job.name }}" >> $GITHUB_OUTPUT
            echo "smoke_tag=ci-test-${{ matrix.job.name }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          {
            echo "tags<<EOF"
            if [ -n "$DOCKER_IMAGE" ]; then
              echo "$DOCKER_IMAGE:${T}-${{ matrix.job.name }}"
            fi
            echo "${{ env.GHCR_IMAGE }}:${T}-${{ matrix.job.name }}"
            if [[ "$T" != *.* ]]; then
              # Integer tag (e.g. v45): formal release, also move latest + major.
              # Preview tag (e.g. v45.1) must never move latest or major.
              if [ -n "$DOCKER_IMAGE" ]; then
                echo "$DOCKER_IMAGE:${{ env.LATEST_TAG }}-${{ matrix.job.name }}"
                echo "$DOCKER_IMAGE:${M}-${{ matrix.job.name }}"
              fi
              echo "${{ env.GHCR_IMAGE }}:${{ env.LATEST_TAG }}-${{ matrix.job.name }}"
              echo "${{ env.GHCR_IMAGE }}:${M}-${{ matrix.job.name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "smoke_tag=${T}-${{ matrix.job.name }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "./docker"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          load: ${{ matrix.job.name == 'amd64' }}
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.job.s6_platform }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save amd64 image for smoke test
        if: matrix.job.name == 'amd64'
        run: docker save ${{ env.GHCR_IMAGE }}:${{ steps.tags.outputs.smoke_tag }} -o /tmp/smoke-image.tar

      - name: Upload amd64 image for smoke test
        if: matrix.job.name == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-amd64
          path: /tmp/smoke-image.tar
          retention-days: 1

  # docker build and push of multiarch images
  docker-manifest:

    name: Docker manifest
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-22.04

    steps:

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_HUB_LOGIN == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV
          if [[ "$T" == *.* ]]; then
            echo "is_preview=true" >> $GITHUB_OUTPUT
          else
            echo "is_preview=false" >> $GITHUB_OUTPUT
          fi
          if [ "$M" = "$T" ]; then
            echo "major_is_version=true" >> $GITHUB_OUTPUT
          else
            echo "major_is_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # manifest for :1.2.3 tag
      - name: Create and push manifest (:ve.rs.ion)
        uses: Noelware/docker-manifest-action@0.4.3
        if: env.DOCKER_HUB_CONFIGURED == 'true'
        with:
          base-image: ${{ secrets.DOCKER_IMAGE }}:${{ env.GIT_TAG }}
          extra-images: ${{ secrets.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-amd64,${{ secrets.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-arm64v8,${{ secrets.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-armv7,${{ secrets.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-i386
          push: true

      # manifest for :1 tag (major release)
      - name: Create and push manifest (:major)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true' && env.DOCKER_HUB_CONFIGURED == 'true' && steps.vars.outputs.major_is_version != 'true'
        with:
          base-image: ${{ secrets.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}
          extra-images: ${{ secrets.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-amd64,${{ secrets.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-arm64v8,${{ secrets.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-armv7,${{ secrets.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-i386
          push: true

      # manifest for :latest tag
      - name: Create and push manifest (:latest)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true' && env.DOCKER_HUB_CONFIGURED == 'true'
        with:
          base-image: ${{ secrets.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}
          extra-images: ${{ secrets.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-amd64,${{ secrets.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-arm64v8,${{ secrets.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-armv7,${{ secrets.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-i386
          push: true

      # GHCR manifests
      # manifest for :1.2.3 tag
      - name: Create and push GHCR manifest (:ve.rs.ion)
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          base-image: ${{ env.GHCR_IMAGE }}:${{ env.GIT_TAG }}
          extra-images: ${{ env.GHCR_IMAGE }}:${{ env.GIT_TAG }}-amd64,${{ env.GHCR_IMAGE }}:${{ env.GIT_TAG }}-arm64v8,${{ env.GHCR_IMAGE }}:${{ env.GIT_TAG }}-armv7,${{ env.GHCR_IMAGE }}:${{ env.GIT_TAG }}-i386
          push: true

      # manifest for :1 tag (major release)
      - name: Create and push GHCR manifest (:major)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true' && steps.vars.outputs.major_is_version != 'true'
        with:
          base-image: ${{ env.GHCR_IMAGE }}:${{ env.MAJOR_TAG }}
          extra-images: ${{ env.GHCR_IMAGE }}:${{ env.MAJOR_TAG }}-amd64,${{ env.GHCR_IMAGE }}:${{ env.MAJOR_TAG }}-arm64v8,${{ env.GHCR_IMAGE }}:${{ env.MAJOR_TAG }}-armv7,${{ env.GHCR_IMAGE }}:${{ env.MAJOR_TAG }}-i386
          push: true

      # manifest for :latest tag
      - name: Create and push GHCR manifest (:latest)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true'
        with:
          base-image: ${{ env.GHCR_IMAGE }}:${{ env.LATEST_TAG }}
          extra-images: ${{ env.GHCR_IMAGE }}:${{ env.LATEST_TAG }}-amd64,${{ env.GHCR_IMAGE }}:${{ env.LATEST_TAG }}-arm64v8,${{ env.GHCR_IMAGE }}:${{ env.LATEST_TAG }}-armv7,${{ env.GHCR_IMAGE }}:${{ env.LATEST_TAG }}-i386
          push: true

            
  # docker build and push of single-arch images
  docker-classic:

    name: Docker push - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64" }
          - { name: "arm64v8", docker_platform: "linux/arm64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7" }

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
        
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker-classic/

      - name: Make binaries executable
        run: chmod -v a+x docker-classic/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_HUB_LOGIN == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.GHCR_IMAGE_CLASSIC }}

      - name: Compute image tags
        id: tags
        env:
          DOCKER_IMAGE_CLASSIC: ${{ secrets.DOCKER_IMAGE_CLASSIC }}
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Validation run: push only a throwaway test tag to GHCR, never latest.
            echo "tags=${{ env.GHCR_IMAGE_CLASSIC }}:ci-test-${{ matrix.job.name }}" >> $GITHUB_OUTPUT
            echo "smoke_tag=ci-test-${{ matrix.job.name }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          {
            echo "tags<<EOF"
            if [ -n "$DOCKER_IMAGE_CLASSIC" ]; then
              echo "$DOCKER_IMAGE_CLASSIC:${T}-${{ matrix.job.name }}"
            fi
            echo "${{ env.GHCR_IMAGE_CLASSIC }}:${T}-${{ matrix.job.name }}"
            if [[ "$T" != *.* ]]; then
              # Integer tag (e.g. v45): formal release, also move latest + major.
              # Preview tag (e.g. v45.1) must never move latest or major.
              if [ -n "$DOCKER_IMAGE_CLASSIC" ]; then
                echo "$DOCKER_IMAGE_CLASSIC:${{ env.LATEST_TAG }}-${{ matrix.job.name }}"
                echo "$DOCKER_IMAGE_CLASSIC:${M}-${{ matrix.job.name }}"
              fi
              echo "${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-${{ matrix.job.name }}"
              echo "${{ env.GHCR_IMAGE_CLASSIC }}:${M}-${{ matrix.job.name }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "smoke_tag=${T}-${{ matrix.job.name }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "./docker-classic"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          load: ${{ matrix.job.name == 'amd64' }}
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save amd64 image for smoke test
        if: matrix.job.name == 'amd64'
        run: docker save ${{ env.GHCR_IMAGE_CLASSIC }}:${{ steps.tags.outputs.smoke_tag }} -o /tmp/smoke-image-classic.tar

      - name: Upload amd64 image for smoke test
        if: matrix.job.name == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-classic-amd64
          path: /tmp/smoke-image-classic.tar
          retention-days: 1

  # docker build and push of multiarch images
  docker-manifest-classic:

    name: Docker manifest
    if: github.event_name == 'push'
    needs: docker-classic
    runs-on: ubuntu-22.04

    steps:

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_HUB_LOGIN == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV
          if [[ "$T" == *.* ]]; then
            echo "is_preview=true" >> $GITHUB_OUTPUT
          else
            echo "is_preview=false" >> $GITHUB_OUTPUT
          fi
          if [ "$M" = "$T" ]; then
            echo "major_is_version=true" >> $GITHUB_OUTPUT
          else
            echo "major_is_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # manifest for :1.2.3 tag
      - name: Create and push manifest (:ve.rs.ion)
        uses: Noelware/docker-manifest-action@0.4.3
        if: env.DOCKER_HUB_CLASSIC_CONFIGURED == 'true'
        with:
          base-image: ${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}
          extra-images: ${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-amd64,${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-arm64v8,${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-armv7
          push: true

      # manifest for :1 tag (major release)
      - name: Create and push manifest (:major)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true' && env.DOCKER_HUB_CLASSIC_CONFIGURED == 'true' && steps.vars.outputs.major_is_version != 'true'
        with:
          base-image: ${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}
          extra-images: ${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-amd64,${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-arm64v8,${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-armv7
          push: true

      # manifest for :latest tag
      - name: Create and push manifest (:latest)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true' && env.DOCKER_HUB_CLASSIC_CONFIGURED == 'true'
        with:
          base-image: ${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}
          extra-images: ${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-amd64,${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-arm64v8,${{ secrets.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-armv7
          push: true

      # GHCR manifests
      # manifest for :1.2.3 tag
      - name: Create and push GHCR manifest (:ve.rs.ion)
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          base-image: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}
          extra-images: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-amd64,${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-arm64v8,${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-armv7
          push: true

      # manifest for :1 tag (major release)
      - name: Create and push GHCR manifest (:major)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true' && steps.vars.outputs.major_is_version != 'true'
        with:
          base-image: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}
          extra-images: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-amd64,${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-arm64v8,${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-armv7
          push: true

      # manifest for :latest tag
      - name: Create and push GHCR manifest (:latest)
        uses: Noelware/docker-manifest-action@0.4.3
        if: steps.vars.outputs.is_preview != 'true'
        with:
          base-image: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}
          extra-images: ${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-amd64,${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-arm64v8,${{ env.GHCR_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-armv7
          push: true


  deb-package:

    name: debian package - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   debian_platform: "amd64",   crossbuild_package: "" }
          - { name: "arm64v8", debian_platform: "arm64",   crossbuild_package: "crossbuild-essential-arm64" }
          - { name: "armv7",   debian_platform: "armhf",   crossbuild_package: "crossbuild-essential-armhf" }
          - { name: "i386",    debian_platform: "i386",    crossbuild_package: "crossbuild-essential-i386" }

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Create packaging env
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y devscripts build-essential debhelper pkg-config ${{ matrix.job.crossbuild_package }}
          mkdir -p debian-build/${{ matrix.job.name }}/bin

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: debian-build/${{ matrix.job.name }}/bin

      - name: Build package for ${{ matrix.job.name }} arch
        run: |
          chmod -v a+x debian-build/${{ matrix.job.name }}/bin/*
          cp -vr debian systemd debian-build/${{ matrix.job.name }}/
          cat debian/control.tpl | sed 's/{{ ARCH }}/${{ matrix.job.debian_platform }}/' > debian-build/${{ matrix.job.name }}/debian/control
          cd debian-build/${{ matrix.job.name }}/
          debuild -i -us -uc -b -a${{ matrix.job.debian_platform }}

      - name: Upload debian packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.job.name }}
          path: |
            debian-build/rustdesk-server-hbbr_*_${{ matrix.job.debian_platform }}.deb
            debian-build/rustdesk-server-hbbs_*_${{ matrix.job.debian_platform }}.deb
            debian-build/rustdesk-server-utils_*_${{ matrix.job.debian_platform }}.deb
          if-no-files-found: error

  # smoke test the freshly built amd64 images: the API must answer on
  # 21114 and runtime data must land in the volume (/data for the s6
  # image, /root for classic), never in /usr/bin next to the binaries.
  # The s6 run also injects a known keypair (KEY_PUB/KEY_PRIV) and
  # checks hbbs actually uses it.
  smoke:

    name: Smoke test - amd64 images
    needs:
      - docker
      - docker-classic
    runs-on: ubuntu-22.04

    steps:

      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-amd64
          path: /tmp/smoke

      - name: Download classic amd64 image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-classic-amd64
          path: /tmp/smoke-classic

      - name: Download amd64 binaries (for rustdesk-utils)
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: /tmp/smoke-bin

      - name: Smoke test the s6 image (data in /data, injected key used)
        run: |
          chmod +x /tmp/smoke-bin/rustdesk-utils
          # Fresh keypair for this run: the key-secret service writes it
          # to /data, and hbbs must read it instead of generating its own.
          KEYPAIR=$(/tmp/smoke-bin/rustdesk-utils genkeypair)
          KEY_PUB=$(echo "$KEYPAIR" | sed -n 's/^Public Key: *//p')
          KEY_PRIV=$(echo "$KEYPAIR" | sed -n 's/^Secret Key: *//p')
          if [ -z "$KEY_PUB" ] || [ -z "$KEY_PRIV" ]; then
            echo "failed to generate a test keypair"
            exit 1
          fi
          IMG=$(docker load -i /tmp/smoke/smoke-image.tar | sed -n 's/^Loaded image: //p')
          if [ -z "$IMG" ]; then
            echo "failed to load smoke image"
            exit 1
          fi
          echo "loaded $IMG"
          mkdir -p /tmp/smoke-data
          docker run -d --name rustdesk-smoke -p 21114:21114 \
            -v /tmp/smoke-data:/data \
            -e KEY_PUB="$KEY_PUB" -e KEY_PRIV="$KEY_PRIV" \
            "$IMG"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:21114/" || true)
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then
              echo "API responded on 21114 (HTTP $CODE) after ${i} attempt(s)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "API did not respond on 21114 within 60s"
              docker logs rustdesk-smoke || true
              exit 1
            fi
            sleep 2
          done
          # Runtime data must land in the /data volume ...
          for i in $(seq 1 15); do
            if [ -f /tmp/smoke-data/db_v2.sqlite3 ] \
              && [ -f /tmp/smoke-data/id_ed25519 ] \
              && [ -f /tmp/smoke-data/id_ed25519.pub ] \
              && [ -f /tmp/smoke-data/api_v1.sqlite3 ] \
              && [ -f /tmp/smoke-data/logs/hbbs.log ]; then
              break
            fi
            if [ "$i" = "15" ]; then
              echo "runtime data did not appear in /data within 30s"
              find /tmp/smoke-data | sort
              docker logs rustdesk-smoke || true
              exit 1
            fi
            sleep 2
          done
          echo "runtime data present in /data:"
          find /tmp/smoke-data -type f | sort
          # ... and must NOT be next to the binaries in /usr/bin.
          if docker exec rustdesk-smoke sh -c 'test -e /usr/bin/db_v2.sqlite3 -o -e /usr/bin/id_ed25519 -o -e /usr/bin/id_ed25519.pub -o -e /usr/bin/api_v1.sqlite3 -o -e /usr/bin/logs'; then
            echo "runtime data leaked into /usr/bin"
            docker exec rustdesk-smoke ls -la /usr/bin/ || true
            exit 1
          fi
          # The injected keypair must be the one the server uses: the
          # public key file keeps the injected value, the startup log
          # shows it as the server's active key, and hbbs read the key
          # instead of generating a fresh pair.
          # Read it from inside the container: key-secret chmods the key
          # files 0600 root-owned, so the runner cannot cat them from the
          # host side of the bind mount.
          if [ "$(docker exec rustdesk-smoke cat /data/id_ed25519.pub)" != "$KEY_PUB" ]; then
            echo "id_ed25519.pub in /data does not match the injected KEY_PUB"
            exit 1
          fi
          LOGS=$(docker logs rustdesk-smoke 2>&1)
          if ! echo "$LOGS" | grep -Fq "Key: $KEY_PUB"; then
            echo "hbbs startup log does not show the injected public key"
            echo "$LOGS"
            exit 1
          fi
          if ! echo "$LOGS" | grep -q "Private key comes from id_ed25519"; then
            echo "hbbs did not read the injected key (expected 'Private key comes from id_ed25519' in the log)"
            echo "$LOGS"
            exit 1
          fi
          if echo "$LOGS" | grep -q "Private/public key written"; then
            echo "hbbs generated a fresh keypair instead of using the injected one"
            exit 1
          fi
          echo "s6 smoke test passed"
          docker stop rustdesk-smoke >/dev/null

      - name: Smoke test the classic image (data in /root)
        run: |
          IMG=$(docker load -i /tmp/smoke-classic/smoke-image-classic.tar | sed -n 's/^Loaded image: //p')
          if [ -z "$IMG" ]; then
            echo "failed to load classic smoke image"
            exit 1
          fi
          echo "loaded $IMG"
          mkdir -p /tmp/smoke-classic-data /tmp/smoke-classic-hbbr
          docker run -d --name rustdesk-smoke-classic -p 21124:21114 \
            -v /tmp/smoke-classic-data:/root \
            "$IMG" hbbs -r 127.0.0.1:21117
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:21124/" || true)
            if [ -n "$CODE" ] && [ "$CODE" != "000" ]; then
              echo "classic API responded on 21124 (HTTP $CODE) after ${i} attempt(s)"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "classic API did not respond on 21124 within 60s"
              docker logs rustdesk-smoke-classic || true
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 15); do
            if [ -f /tmp/smoke-classic-data/db_v2.sqlite3 ] \
              && [ -f /tmp/smoke-classic-data/id_ed25519 ] \
              && [ -f /tmp/smoke-classic-data/id_ed25519.pub ] \
              && [ -f /tmp/smoke-classic-data/api_v1.sqlite3 ] \
              && [ -f /tmp/smoke-classic-data/logs/hbbs.log ]; then
              break
            fi
            if [ "$i" = "15" ]; then
              echo "runtime data did not appear in the classic volume within 30s"
              find /tmp/smoke-classic-data | sort
              docker logs rustdesk-smoke-classic || true
              exit 1
            fi
            sleep 2
          done
          echo "runtime data present in the classic volume:"
          find /tmp/smoke-classic-data -type f | sort
          # The scratch image has no shell: copy /usr/bin out and check
          # from the host side that no runtime data leaked there.
          docker cp rustdesk-smoke-classic:/usr/bin /tmp/classic-usrbin
          for f in db_v2.sqlite3 id_ed25519 id_ed25519.pub api_v1.sqlite3 logs; do
            if [ -e "/tmp/classic-usrbin/$f" ]; then
              echo "runtime data leaked into classic /usr/bin: $f"
              ls -la /tmp/classic-usrbin/ || true
              exit 1
            fi
          done
          echo "classic hbbs smoke test passed"
          docker stop rustdesk-smoke-classic >/dev/null
          # hbbr shares the anchor code: its log must land in the volume too.
          docker run -d --name rustdesk-smoke-classic-hbbr \
            -v /tmp/smoke-classic-hbbr:/root \
            "$IMG" hbbr
          for i in $(seq 1 15); do
            if [ -f /tmp/smoke-classic-hbbr/logs/hbbr.log ]; then
              break
            fi
            if [ "$i" = "15" ]; then
              echo "hbbr log did not appear in the classic volume within 30s"
              find /tmp/smoke-classic-hbbr | sort
              docker logs rustdesk-smoke-classic-hbbr || true
              exit 1
            fi
            sleep 2
          done
          echo "classic hbbr smoke test passed"
          docker stop rustdesk-smoke-classic-hbbr >/dev/null
